<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
            border: 2px solid black;
        }

       tr.linha{
            background-color: gray;
            border: 2px solid black;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            border: 2px solid black;
        }

        td.dado{
            background-color: green;
        }

    </style>
</head>
<body>
    <h1>TABELA</h1>

    <table>

        <tr> <!--Primeira linha-->
               <td>A1</td>
               <td>B1</td>
               <td>C1</td>
        </tr>

        <tr class="linha"> <!--Segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>

        <tr> <!--Terceira linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>

        <tr> <!--Quarta linha-->
            <td class="dado">A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>

    </table>
</body>
</html>
